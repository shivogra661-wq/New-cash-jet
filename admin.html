<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#078c47"><title>CASH JET · Master Admin</title><style>:root{--g:#078c47;--ink:#193127;--muted:#62766a;--line:#d9e9de;--bg:#f1f7f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.top{background:linear-gradient(110deg,#078c47,#0bb85a);color:#fff;padding:18px 20px;font-size:22px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin:40px auto;max-width:420px;box-shadow:0 3px 12px #143d2010}h1{font-size:21px;margin-top:0}.muted{color:var(--muted);font-size:13px;line-height:1.5}label{font-size:13px;font-weight:700;display:block}input{width:100%;padding:12px;border:1px solid #cedfd3;border-radius:10px;margin:5px 0 12px;font:inherit}button{border:0;border-radius:10px;padding:12px 14px;background:var(--g);color:white;font:inherit;font-weight:750;width:100%}.msg{font-size:13px;min-height:18px;color:var(--g)}.err{color:#b32330}a{color:var(--g)}</style></head><body><div class="top">🟢 CASH JET · Master Admin</div><main class="card"><h1>Admin login</h1><p class="muted">This is a separate private login page. Use the password configured in Railway environment variables.</p><form id="login"><label>Master Admin password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Log in to Admin Panel</button><p id="msg" class="msg"></p></form><p class="muted"><a href="/">Back to player site</a></p></main><script>let csrf='';async function boot(){const r=await fetch('/api/session',{credentials:'same-origin'});const d=await r.json();csrf=d.csrf;if(d.role==='master')location.replace('/?admin=1');else if(d.role==='player')location.replace('/')}boot().catch(()=>{});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','x-csrf-token':csrf},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.replace('/?admin=1')}catch(err){m.textContent=err.message;m.classList.add('err')}};</script></body></html>
